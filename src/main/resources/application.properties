spring.application.name=TRIP NEST
# A local H2 database lets the application start without relying on an external service.
# Set DB_URL, DB_USERNAME, and DB_PASSWORD to use MySQL in a deployed environment.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/tripnest;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
server.port=8082
# Override JWT_SECRET in each deployed environment. It must be a Base64-encoded key of at least 256 bits.
security.jwt.secret=${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50SldUU2VjcmV0S2V5VGhhdElzMzJC}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
